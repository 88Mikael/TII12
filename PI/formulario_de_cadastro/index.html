<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Formulário de cadastro</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="container">
        <div class="" form-image">
            <img src="assets/img/undraw_shopping_a55o.svg">
        </div>
        <div class="form">
            <form action="#">
                <div class="form-header">
                    <div class="title">
                        <h1>cadastre-se</h1>
                    </div>
                    <div class="login-button">
                        <button><a href="#">Entrar</a></button>
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-box">
                        <label for="firstname">Primeiro nome</label>
                        <input id="firstname" type="text" name="firstname" placeholder="Digite seu primeiro nome"
                            required></label>
                    </div>
                    <div class="input-box">
                        <label for="lastname">Sobrenome</label>
                        <input id="lastname" type="text" name="lastname" placeholder="Digite seu sobrenome"
                            required></label>
                    </div>

                    <div class="input-box">
                        <label for="email">Endereço de email</label>
                        <input id="email" type="email" name="email" placeholder="Digite seu endereço de email"
                            required></label>
                    </div>
                        <div class="input-box">
                        <label for="numer">Celular</label>
                        <input id="number" type="text" name="number" placeholder="(xx) xxxxx-xxxx"
                            required></label>
                    </div>

                   <div class="input-box">
                        <label password="">Senha</label>
                        <input id="password" type="password" name="password" placeholder="Digite sua senha"
                            required></label>
                    </div>

                     <div class="input-box">
                        <label password="">Confirme sua senha</label>
                        <input id="password" type="password" name="confirmpassword" placeholder="Digite sua senha"
                            required></label>
                    </div> 
                    <div class="continue-botton">
                        <button><a href="#">Continuar</a></button>
                    </div>

            </form>
        </div>
</body>

</html>
